# VoxClaw 主配置文件；修改后重新运行 `python app.py` 生效。
# 如果只改提示音文案或音色，还需要重新运行 `python scripts/generate_voice_assets.py` 生成 assets/*.wav。

audio: # 音频采集/播放配置
  sample_rate: 16000 # 麦克风采样率；openWakeWord 和 Silero VAD 建议使用 16000，不建议随意修改
  channels: 1 # 音频通道数；1 表示单声道，当前录音与 VAD 流程按单声道设计
  block_size: 512 # 每次从麦克风读取的帧大小；512 适配当前 VAD/唤醒检测延迟与稳定性
  input_device: null # 输入设备；null 表示系统默认麦克风，也可填 `python -m audio.device` 输出的设备编号或名称
  output_device: null # 输出设备；null 表示系统默认扬声器/耳机，也可填 `python -m audio.device` 输出的设备编号或名称

wakeword: # 唤醒词检测配置
  model: "hey_jarvis" # 唤醒词模型；可填内置模型名（hey_jarvis / alexa），或 wakeword/hotwords/ 下自训练 .onnx 文件名
  threshold: 0.4 # 唤醒阈值；越低越灵敏但越容易误唤醒，越高越严格；可用 `python scripts/test_wakeword.py` 实测
  cooldown_s: 2.0 # 唤醒冷却时间（秒）；一次唤醒后多少秒内忽略重复触发，避免连续误触发

vad: # 语音活动检测配置，用于判断用户何时开始/结束说话
  threshold: 0.6 # VAD 语音概率阈值；越低越容易判定为说话，越高越能过滤噪音但可能漏掉轻声
  silence_ms: 500 # 静音判停时间（毫秒）；说话后连续静音达到该时长就结束本轮录音
  speech_timeout_s: 6.0 # 首次唤醒后等待用户开口的最长时间（秒）；超时则回到待机
  max_record_s: 15.0 # 单次录音最大时长（秒）；超过后强制结束，防止长时间占用流程
  pre_roll_ms: 300 # 预录音时长（毫秒）；保留检测到语音前的一小段音频，避免吞掉开头的字

conversation: # 对话流程配置
  mode: "multi" # 对话模式；single=回答一次后回待机，multi=回答后继续等待追问，无需再次唤醒
  follow_up_timeout_s: 10.0 # 多轮模式下等待追问的时长（秒）；超时未说话则结束会话并回待机
  exit_words: ["关闭", "退下", "关机", "停止", "退出", "再见", "闭嘴", "休眠", "拜拜", "Bye bye", "拜拜了您", "拜拜了您嘞", "拜拜了您嘞！", "拜拜了您嘞！再见", "拜拜了您嘞！再见！", "拜拜了您嘞！再见啦", "拜拜了您嘞！再见啦！", "拜拜了您嘞！再见啦！再见啦", "Bye bye啦", "Bye bye啦！", "Bye bye啦！再见啦", "Bye bye啦！再见啦！"] # 语音退出指令；STT 文本命中这些短词时播放 sleep 提示音并结束当前会话

debug: # DEBUG/调试配置
  manual_wake_hotkey: "<shift>+<ctrl>+i" # DEBUG 手动唤醒热键；仅 `python app.py --debug` 启用；macOS 需辅助功能权限，Windows 可改为 `<ctrl>+<alt>+i`

prompts: # 提示词与提示音文案配置
  system: "你是 VoxClaw 语音助手。回答要简洁口语化，适合语音播报，控制在三到五句话以内，不要使用 Markdown 格式。" # LLM 系统提示词；用于控制助手人设、回复风格、长度和禁用 Markdown 等行为
  voice_assets: # 提示音文案；修改后运行 `python scripts/generate_voice_assets.py` 重新生成对应 assets/*.wav
    greeting: "hi，我是贾维斯，有什么需要随时喊我。" # 服务启动时播放的问候语，对应 assets/greeting.wav
    wake: "我在。" # 唤醒成功后播放的回应语，对应 assets/wake.wav
    error: "我没有听清楚，请重新说一遍。" # 识别失败、模型异常等场景播放的提示语，对应 assets/error.wav
    sleep: "好的，有需要再喊我。" # 收到退出指令后播放的休眠提示语，对应 assets/sleep.wav

tools: # 外部工具总开关；用于天气、新闻、提醒等实时/本地工具能力
  enabled: true # 是否启用工具层；false 时所有问题都直接走普通 LLM

calendar: # 本地日历/时间工具配置；用于回答今天星期几、明天几号、下周一是几号等问题
  enabled: true # 是否启用日历工具；启用后命中日期/星期/时间问题时不走 LLM，直接本地计算
  timezone: "Asia/Shanghai" # 本地时区；用于计算今天/明天/下周等相对日期

reminder: # 本地提醒/定时器工具配置
  enabled: true # 是否启用提醒工具；支持多个提醒、取消提醒、到点后语音播报
  timezone: "Asia/Shanghai" # 提醒时间解析时区；用于计算“十分钟后、明天八点”等相对/绝对时间
  storage_path: "data/reminders.json" # 待触发提醒持久化文件；重启后未到期提醒仍会保留
  check_interval_s: 1.0 # 后台检查提醒是否到期的间隔秒数；越小越及时但占用略高

tavily: # Tavily REST API 配置；当前用于实时天气搜索，后续也可用于新闻/热点
  enabled: true # 是否启用 Tavily；需要同时配置 api_key 或环境变量 TAVILY_API_KEY
  api_key: "" # Tavily API Key；建议使用环境变量 TAVILY_API_KEY 或 VOXCLAW_TAVILY_API_KEY，模板文件请保持为空
  endpoint: "https://api.tavily.com/search" # Tavily Search API 地址；通常保持默认即可
  search_depth: "basic" # 搜索深度；basic 更快更省额度，advanced 更深入但更慢更耗额度
  max_results: 5 # 每次搜索返回结果数量；天气查询 3-5 条通常够用
  timeout_s: 10.0 # Tavily 请求超时时间（秒）；网络较慢可适当调大

doubao_search: # 豆包搜索 API 配置；国内网络下可作为 Tavily 的替代搜索源
  enabled: true # 是否启用豆包搜索；weather.provider=doubao 时需要开启
  api_key: "" # 豆包搜索 API Key；建议使用环境变量 DOUBAO_SEARCH_API_KEY 或 VOLCENGINE_SEARCH_API_KEY，模板文件请保持为空
  endpoint: "https://open.feedcoopapi.com/search_api/global_search" # 豆包搜索 Global Search API 地址；通常保持默认即可
  doc_count: 5 # 每次搜索返回文档数量；天气查询 3-5 条通常够用
  max_snippet_length: 500 # 每条结果摘要最大长度；越大信息越完整但响应更长
  max_image_count_per_doc: 0 # 每条结果返回图片数；语音天气播报不需要图片，保持 0 即可
  timeout_s: 10.0 # 豆包搜索请求超时时间（秒）；网络较慢可适当调大

weather: # 天气查询工具配置；通过搜索 API 获取实时天气网页信息，再由 LLM 总结
  enabled: true # 是否启用天气工具；命中天气关键词时优先走该工具
  provider: "doubao" # 天气数据来源；可选 doubao / tavily，国内网络建议 doubao
  default_location: "上海松江" # 默认天气位置；用户没说城市/区县时使用这里
  timezone: "Asia/Shanghai" # 查询时区；用于“今天/明天/下午”等相对时间判断

step: # Step API 配置，用于 STT 和 TTS
  api_key: "" # Step API Key；建议生产环境使用环境变量 STEP_API_KEY 或 VOXCLAW_STEP_API_KEY 覆盖，模板文件请保持为空
  stt_endpoint: "https://api.stepfun.com/v1/audio/transcriptions" # Step STT 接口地址；通常保持默认即可
  tts_endpoint: "https://api.stepfun.com/v1/audio/speech" # Step TTS HTTP 接口地址；transport=http 时使用，也用于生成提示音
  stt_model: "step-asr" # STT 模型名；Step 语音识别默认使用 step-asr
  tts_model: "step-tts-mini" # TTS 模型名；HTTP 和 WebSocket TTS 都会使用该模型参数

llm: # 大语言模型后端配置
  provider: "stepfun" # LLM 后端选择；openclaw=本地 OpenClaw Gateway，stepfun=Step API 直连，deepseek=DeepSeek API
  timeout_s: 60.0 # LLM 请求超时时间（秒）；网络慢或本地模型慢时可适当调大
  max_history: 20 # 发送给 LLM 的历史消息数量上限；越大上下文越完整，但请求越慢、token 消耗越高
  openclaw: # 本地 OpenClaw Gateway 配置；provider=openclaw 时使用
    endpoint: "http://127.0.0.1:18789" # OpenClaw Gateway 地址；使用本地贾维斯/OpenClaw 服务时保持默认或改为你的网关地址
    api_key: "" # OpenClaw Gateway 鉴权 token；对应 gateway.auth.token，可用环境变量 OPENCLAW_API_KEY 覆盖
    model: "openclaw" # OpenClaw Gateway 暴露的模型名；通常保持 openclaw
  stepfun: # Step OpenAI 兼容 LLM 配置；provider=stepfun 时使用
    endpoint: "https://api.stepfun.com" # Step OpenAI 兼容接口地址
    api_key: "" # Step LLM API Key；留空会自动复用上面的 step.api_key
    model: "step-3.5-flash" # Step LLM 模型名；可按 Step 官方支持模型调整
  deepseek: # DeepSeek OpenAI 兼容 LLM 配置；provider=deepseek 时使用
    endpoint: "https://api.deepseek.com" # DeepSeek OpenAI 兼容接口地址
    api_key: "" # DeepSeek API Key；也可通过环境变量 DEEPSEEK_API_KEY 设置，模板文件请保持为空
    model: "deepseek-chat" # DeepSeek 模型名；deepseek-chat 适合普通对话，deepseek-reasoner 适合推理但延迟更高

tts: # 语音合成配置
  provider: "step" # TTS 服务商；step=阶跃星辰，xfyun=科大讯飞
  voice: "linjiajiejie" # Step TTS 音色 ID；provider=step 时使用，如 wenrounvsheng / cixingnansheng / linjiajiejie
  speed: 1.2 # Step 语速倍率；provider=step 时使用，1.0 为正常速度，大于 1 更快，小于 1 更慢
  transport: "websocket" # Step TTS 传输方式；provider=step 时使用，websocket=流式低延迟，http=整段合成；provider=xfyun 时固定流式播放
  ws_endpoint: "wss://api.stepfun.com/v1/realtime/audio" # Step TTS WebSocket 地址；transport=websocket 时使用
  ws_sample_rate: 24000 # WebSocket TTS 输出采样率；需与 Step TTS 返回音频配置匹配，通常保持 24000

xfyun_tts: # 科大讯飞 TTS 配置；tts.provider=xfyun 时使用，控制台服务：https://console.xfyun.cn/services/tts
  app_id: "" # 讯飞应用 AppID；建议用环境变量 XFYUN_APP_ID 或 VOXCLAW_XFYUN_APP_ID
  api_key: "" # 讯飞 WebAPI APIKey；建议用环境变量 XFYUN_API_KEY 或 VOXCLAW_XFYUN_API_KEY
  api_secret: "" # 讯飞 WebAPI APISecret；建议用环境变量 XFYUN_API_SECRET 或 VOXCLAW_XFYUN_API_SECRET
  endpoint: "wss://tts-api.xfyun.cn/v2/tts" # 讯飞在线 TTS WebSocket 地址；通常保持默认即可
  voice: "x4_yezi" # 讯飞发音人；普通话常用 x4_yezi，可在讯飞控制台查看可用发音人
  sample_rate: 16000 # 讯飞输出采样率；普通在线 TTS 常用 16000
  speed: 50 # 讯飞语速，范围通常 0-100；50 为默认
  volume: 50 # 讯飞音量，范围通常 0-100；50 为默认
  pitch: 50 # 讯飞音高，范围通常 0-100；50 为默认
  timeout_s: 30.0 # 讯飞 TTS 连接与合成超时时间（秒）
